name: Build Xiaomi RC01 DHCP complete firmware

on:
  workflow_dispatch:
    inputs:
      software_updates:
        description: 'Software feeds/apps: latest stable per build, or reviewed locked baseline'
        type: choice
        required: true
        default: latest
        options:
          - latest
          - locked
      replay_run_id:
        description: 'Optional prior run ID: replay its rc01-software-source-lock artifact'
        type: string
        required: false
        default: ''
      include_dae:
        description: 'Experimental dae + daede UI; exact version in this build source lock (runtime unverified)'
        type: boolean
        required: true
        default: false
      go_bootstrap:
        description: 'Go bootstrap: verified official binary or full source chain'
        type: choice
        required: true
        default: external
        options:
          - external
          - source
      cold_cache:
        description: 'Skip download/ccache restore and save; use fresh local caches'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: rc01-${{ github.ref }}-${{ inputs.include_dae }}-${{ inputs.software_updates || 'latest' }}-${{ inputs.go_bootstrap }}-${{ inputs.replay_run_id || 'fresh' }}
  cancel-in-progress: false

env:
  TARGET_DIR: bin/targets/qualcommbe/ipq95xx
  CCACHE_MAXSIZE: 3G
  CCACHE_COMPILERCHECK: content
  RC01_GO_BOOTSTRAP_MODE: ${{ inputs.go_bootstrap }}
  TZ: Asia/Singapore
  RC01_WITH_DAE: ${{ inputs.include_dae }}
  RC01_UPDATE_MODE: ${{ inputs.software_updates || 'latest' }}

jobs:
  build:
    name: RC01 Du v2 / 120 MiB / DHCP complete
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout custom source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record source time
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Reclaim runner space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker system prune --all --force --volumes || true
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang llvm flex bison gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev zlib1g-dev python3-dev python3-setuptools \
            python3-pyelftools python3-cryptography rsync swig unzip file wget \
            pkg-config ca-certificates xz-utils zstd device-tree-compiler mtd-utils squashfs-tools shellcheck busybox

      - name: Look up source downloads
        id: downloads_lookup
        if: ${{ !inputs.cold_cache }}
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: dl
          lookup-only: true
          key: rc01-dl-${{ runner.os }}-${{ hashFiles('config/rc01/feeds.conf', 'config/rc01/dae.config', 'defconfig/qualcommbe-rc01.config') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            rc01-dl-${{ runner.os }}-${{ hashFiles('config/rc01/feeds.conf', 'config/rc01/dae.config', 'defconfig/qualcommbe-rc01.config') }}-
            rc01-dl-${{ runner.os }}-


      - name: Restore source downloads
        id: downloads_cache
        if: ${{ !inputs.cold_cache && steps.downloads_lookup.outputs.cache-matched-key != '' }}
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: ${{ steps.downloads_lookup.outputs.cache-matched-key }}

      - name: Look up compiler cache
        id: compiler_lookup
        if: ${{ !inputs.cold_cache }}
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          lookup-only: true
          key: rc01-ccache-v2-content-${{ runner.os }}-${{ runner.arch }}-qualcommbe-ipq95xx-${{ hashFiles('toolchain/**', 'include/toolchain*.mk', 'rules.mk', 'target/linux/generic/kernel-6.18') }}-${{ hashFiles('defconfig/qualcommbe-rc01.config', 'config/rc01/dae.config') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            rc01-ccache-v2-content-${{ runner.os }}-${{ runner.arch }}-qualcommbe-ipq95xx-${{ hashFiles('toolchain/**', 'include/toolchain*.mk', 'rules.mk', 'target/linux/generic/kernel-6.18') }}-${{ hashFiles('defconfig/qualcommbe-rc01.config', 'config/rc01/dae.config') }}-
            rc01-ccache-v2-content-${{ runner.os }}-${{ runner.arch }}-qualcommbe-ipq95xx-${{ hashFiles('toolchain/**', 'include/toolchain*.mk', 'rules.mk', 'target/linux/generic/kernel-6.18') }}-


      - name: Restore compiler cache
        id: compiler_cache
        if: ${{ !inputs.cold_cache && steps.compiler_lookup.outputs.cache-matched-key != '' }}
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ${{ steps.compiler_lookup.outputs.cache-matched-key }}

      - name: Discard incomplete cache restores or select cold mode
        id: cache_state
        shell: bash
        env:
          RC01_COLD_CACHE: ${{ inputs.cold_cache }}
          RC01_DOWNLOADS_LOOKUP_OUTCOME: ${{ steps.downloads_lookup.outcome }}
          RC01_DOWNLOADS_EXPECTED_KEY: ${{ steps.downloads_lookup.outputs.cache-matched-key }}
          RC01_DOWNLOADS_RESTORE_OUTCOME: ${{ steps.downloads_cache.outcome }}
          RC01_DOWNLOADS_RESTORED_KEY: ${{ steps.downloads_cache.outputs.cache-matched-key }}
          RC01_COMPILER_LOOKUP_OUTCOME: ${{ steps.compiler_lookup.outcome }}
          RC01_COMPILER_EXPECTED_KEY: ${{ steps.compiler_lookup.outputs.cache-matched-key }}
          RC01_COMPILER_RESTORE_OUTCOME: ${{ steps.compiler_cache.outcome }}
          RC01_COMPILER_RESTORED_KEY: ${{ steps.compiler_cache.outputs.cache-matched-key }}
        run: python3 -B scripts/rc01-ci-cache.py

      - name: Run offline regression checks
        run: python3 -B -m unittest discover -s tests/rc01 -v

      - name: Select and verify Go bootstrap before configuration
        shell: bash
        run: |
          set -euo pipefail
          case "$RC01_GO_BOOTSTRAP_MODE" in
            external)
              bootstrap_root="$(python3 -B scripts/rc01-go-bootstrap.py install "$RUNNER_TEMP/rc01-go-bootstrap")"
              echo "RC01_GO_BOOTSTRAP_ROOT=$bootstrap_root" >> "$GITHUB_ENV"
              ;;
            source) echo 'RC01_GO_BOOTSTRAP_ROOT=' >> "$GITHUB_ENV" ;;
            *) echo 'Invalid bootstrap mode' >&2; exit 1 ;;
          esac

      - name: Load an earlier software source lock
        if: ${{ inputs.replay_run_id != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPLAY_RUN_ID: ${{ inputs.replay_run_id }}
        run: |
          set -euo pipefail
          [[ "$REPLAY_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Invalid replay run ID' >&2; exit 1; }
          gh run download "$REPLAY_RUN_ID" --repo "$GITHUB_REPOSITORY" --name rc01-software-source-lock --dir "$RUNNER_TEMP/rc01-replay"
          echo "RC01_REPLAY_LOCK=$RUNNER_TEMP/rc01-replay/lock.json" >> "$GITHUB_ENV"

      - name: Resolve software sources and prepare configuration
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/prepare-rc01.sh 2>&1 | tee prepare.log
          ./scripts/diffconfig.sh > rc01.diffconfig
          echo "SOURCE_DATE_EPOCH=$(python3 -c 'import json; print(json.load(open(".rc01-sources/lock.json"))["source_date_epoch"])')" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check source lock and documentation before publishing
        id: source_privacy
        if: ${{ always() && !cancelled() && hashFiles('.rc01-sources/lock.json') != '' }}
        run: python3 -B scripts/validate-rc01-public-artifacts.py .rc01-sources docs/rc01-build.md

      - name: Preserve this build's software source lock
        if: ${{ always() && !cancelled() && steps.source_privacy.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: rc01-software-source-lock
          if-no-files-found: ignore
          retention-days: 90
          include-hidden-files: true
          path: |
            .rc01-sources/lock.json
            .rc01-sources/feeds.conf
            .rc01-sources/package-manifest.json
            .rc01-sources/dae-sources.json
            .rc01-sources/dae.patch

      - name: Download package sources
        id: downloads
        shell: bash
        run: |
          set -o pipefail
          if ! make -j4 download 2>&1 | tee download.log; then
            make -j1 V=s download 2>&1 | tee -a download.log
          fi

      - name: Initialize build observations
        id: build_metrics
        shell: bash
        env:
          RC01_COLD_CACHE: ${{ inputs.cold_cache }}
          RC01_DOWNLOADS_MATCHED_KEY: ${{ steps.downloads_cache.outputs.cache-matched-key }}
          RC01_COMPILER_MATCHED_KEY: ${{ steps.compiler_cache.outputs.cache-matched-key }}
          RC01_DOWNLOADS_CACHE_OUTCOME: ${{ steps.downloads_cache.outcome }}
          RC01_COMPILER_CACHE_OUTCOME: ${{ steps.compiler_cache.outcome }}
        run: python3 -B scripts/rc01-ci-metrics.py prepare "$RUNNER_TEMP/rc01-metrics"

      - name: Build firmware
        id: firmware
        shell: bash
        run: python3 -B scripts/rc01-ci-build.py

      - name: Record compiler/cache statistics before acceptance builds
        if: ${{ !cancelled() && steps.build_metrics.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          RC01_COLD_CACHE: ${{ inputs.cold_cache }}
          RC01_DOWNLOADS_MATCHED_KEY: ${{ steps.downloads_cache.outputs.cache-matched-key }}
          RC01_COMPILER_MATCHED_KEY: ${{ steps.compiler_cache.outputs.cache-matched-key }}
          RC01_DOWNLOADS_CACHE_OUTCOME: ${{ steps.downloads_cache.outcome }}
          RC01_COMPILER_CACHE_OUTCOME: ${{ steps.compiler_cache.outcome }}
        run: python3 -B scripts/rc01-ci-metrics.py report "$RUNNER_TEMP/rc01-metrics"

      - name: Check build observations before publishing
        id: metrics_privacy
        if: ${{ !cancelled() && steps.build_metrics.outcome == 'success' }}
        run: python3 -B scripts/validate-rc01-public-artifacts.py "$RUNNER_TEMP/rc01-metrics" rc01-build-timings.json

      - name: Upload build observations
        if: ${{ !cancelled() && steps.build_metrics.outcome == 'success' && steps.metrics_privacy.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: rc01-build-observations-${{ github.run_number }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/rc01-metrics/
            rc01-build-timings.json

      - name: Record build inputs
        shell: bash
        run: |
          set -euo pipefail
          go_compiler="$(python3 -B scripts/validate-rc01-go-version.py)"
          cp .config "$TARGET_DIR/rc01.config"
          if [ -f rc01-build-timings.json ]; then
            cp rc01-build-timings.json "$TARGET_DIR/rc01-build-timings.json"
          fi
          for phase in prepare report; do
            if [ -f "$RUNNER_TEMP/rc01-metrics/$phase.json" ]; then
              cp "$RUNNER_TEMP/rc01-metrics/$phase.json" "$TARGET_DIR/rc01-ci-$phase.json"
            fi
          done
          cp rc01.diffconfig "$TARGET_DIR/rc01.diffconfig"
          cp .rc01-sources/feeds.conf "$TARGET_DIR/rc01-feeds.lock"
          cp .rc01-sources/lock.json "$TARGET_DIR/rc01-software-source-lock.json"
          cp scripts/rc01-platform-sources.json "$TARGET_DIR/rc01-platform-sources.json"
          python3 -c 'import json, pathlib, sys; s=json.loads(pathlib.Path(".rc01-sources/lock.json").read_text()); pathlib.Path(sys.argv[1]).write_text(json.dumps(s["package_manifest"], indent=2)+"\n")' "$TARGET_DIR/rc01-package-sources.json"
          python3 -B scripts/rc01-source-metadata.py "$TARGET_DIR/rc01-source-metadata.json"
          cp -a config/rc01/patches/packages "$TARGET_DIR/rc01-package-patches"
          cp files/etc/uci-defaults/89-rc01-bypass "$TARGET_DIR/rc01-network-defaults.sh"
          {
            echo "repository=immortalwrt-viking"
            echo "source_commit=$(git rev-parse HEAD)"
            echo "source_tree=$(git rev-parse 'HEAD^{tree}')"
            echo "viking_baseline=e5b0e82156513e81b6b712e4498ab15fd3a28571"
            echo "viking_reviewed_head=7b3b0f0fce341d6a92a0ad9b1b3d37e3fe384f8b"
            echo "viking_integration=selected-commits"
            echo "viking_full_merge=false"
            echo "viking_selected_commits=4e7173571c64faced3172e51a83fa314d5d5f600,47ce1cd5dfeffb9c7789c8b637f654098898d6a3,d58d0507801a3cab73802e6434314eea0596ba31,5dbfbfe46225e244fe06c42f11b50bc710f731dd,f120d87c9200ae1ddad9a1d9996d51cf0fb14709,1e95b974f6e040e24a26800d5aa9dcc9e0f592d8,6149690bf77473633aaf820d6569c97a9f2908ab,490d9e9cb2131a989551a055c0e84f70174e3787,490a5b388762702dd68b81472095f8773265adc9,7e8c4cef998c6789a29d2253b21a2721e3f19044,ec73307670005a1f00cbeb039dc90709fa2a871e,90f54dddcf833c2ddde722dd8b298ec54c59eb98,a7593dae2e669a61c7815e87b7d38d3a91184756,279676f8088d1af739a133879bfbce4e00b9175f,50595e765f42bdb518402f8a0bd1ae1f649f4823,29fc7b2153c5f965024b0c0632a844f9b173813c,e0d65efeee0db0bd8ec9d49c8cfc70e05ec98ad5,11bdaa6c6fbf570e664a9b670cf54d0feba8b387,30b66b0fba4dfc248d61915b08e92e4cabd2323a,9d326a6a05e6237fc8dfb4ec716c4f11eb6e6bcc,e44e8cf26aa8e5abc204bdf54f58d27aaac993a7,7a54294609a4a8075eac2302f60e3a4031ef3596,ced6a648901fa6ff7f2a18d854164845d89fa024,6c57d4105add93c3b983ca2dfbb4d6f66f696f92,f9dd19a1a2820891cddd0c3cea538984a5b6c497,b4f7857f9c0c21e83d0c3e76917093f4011053db,516da1de900c3ae45daa09cbfbfec985e0179661,d7cb81d96a4a10ab5a44ce916dc5d9406cd44559,99977bd751741658172c6d0f1df21af662a375e8"
            echo "viking_followup_commits=4e7173571c64faced3172e51a83fa314d5d5f600,47ce1cd5dfeffb9c7789c8b637f654098898d6a3,d58d0507801a3cab73802e6434314eea0596ba31,5dbfbfe46225e244fe06c42f11b50bc710f731dd"
            echo "ppe_ds_nodes_ipq9574=3"
            echo "source_date_epoch=$SOURCE_DATE_EPOCH"
            echo "kernel=6.18.60"
            echo "kernel_source_sha256=3c2f44ef6acc021a7ad444d9a2e6ec1ef488ff09368793d0004a6080f69d621e"
            echo "mac80211=7.2-r47 (local selected-commits)"
            echo "ipq_wifi=7@5363395811fb3c72da0e62304a26d995c0f9c675"
            echo "mihomo=$(sed -n 's/^PKG_VERSION:=//p' feeds/nikki/mihomo-meta/Makefile)"
            echo "tailscale=$(sed -n 's/^PKG_VERSION:=//p' feeds/packages/net/tailscale/Makefile)"
            echo "nikki=$(sed -n 's/^PKG_VERSION:=//p' feeds/nikki/nikki/Makefile)"
            echo "dnsmasq=2.93-r10@10fbc39cf57220eb93f61ce282d7561750f8d29d"
            echo "rc01_cma_mib=320"
            echo "qcn9274_hw1_mlo=false"
            echo "qcn9274_hw1_ds_abi=0x10098b57/WBE.1.0-02903"
            echo "ath12k_firmware=2026.11.07~774f0cca-r1"
            echo "pcie_rx_allocator=slab; original resource profile"
            echo "q6_remoteproc=disabled; unbound"
            echo "go_bootstrap_mode=$RC01_GO_BOOTSTRAP_MODE"
            echo "go_bootstrap_version=1.24.13"
            if [ "$RC01_GO_BOOTSTRAP_MODE" = external ]; then
              echo "go_bootstrap_archive_sha256=1fc94b57134d51669c72173ad5d49fd62afb0f1db9bf3f798fd98ee423f8d730"
            fi
            echo "go_compiler=$go_compiler"
            echo "ccache_compiler_check=$CCACHE_COMPILERCHECK"
            echo "cold_cache=${{ inputs.cold_cache }}"
            echo "physical_acceptance=not-performed"
            echo "boot_verified_base=43fc40c991523305d8ec5ff1b5714f063dfeb091"
            echo "lan_address_mode=dhcp-client"
            echo "dhcp_client_hostname=RC01"
            echo "fan_pwm_output=push-pull"
            echo "dae_test_build=$RC01_WITH_DAE"
            echo "nand_id_match=full-per-entry-length; ESMT device ID=51:7f:7f"
            echo "nand_probe_diagnostics=true"
            for feed in packages luci routing nikki daede; do
              echo "feed_$feed=$(git -C "feeds/$feed" rev-parse HEAD)"
            done
          } > "$TARGET_DIR/rc01-build-metadata.txt"
          cp target/linux/generic/backport-6.18/442-v6.19-mtd-spinand-esmt-f50d2g41ka-qpic-id.patch "$TARGET_DIR/rc01-nand-id-correction.patch"
          cp target/linux/qualcommbe/patches-6.18/0412-mtd-spinand-rc01-probe-diagnostics.patch "$TARGET_DIR/rc01-nand-probe-diagnostics.patch"
          git -C feeds/nikki diff -- mihomo-meta/Makefile > "$TARGET_DIR/rc01-nikki-build.patch"
          git -C feeds/packages diff -- lang/golang/golang-compiler.mk lang/golang/golang-host-build.mk > "$TARGET_DIR/rc01-go-build.patch"
          if [ "$RC01_WITH_DAE" = true ]; then
            cp feeds/daede/ci/pins.env "$TARGET_DIR/rc01-daede-upstream.lock"
            if [ -f .rc01-sources/dae.patch ]; then
              cp .rc01-sources/dae.patch "$TARGET_DIR/rc01-daede-build.patch"
            else
              cp config/rc01/patches/daede/100-rc01-dae-lifecycle-and-source-policy.patch "$TARGET_DIR/rc01-daede-build.patch"
            fi
            cp feeds/daede/dae/Makefile "$TARGET_DIR/rc01-dae.Makefile"
          fi
          (cd "$TARGET_DIR"; sha256sum -- *xiaomi_be10000-squashfs-* > rc01-images.sha256)

      - name: Check image metadata before publishing
        id: image_privacy
        if: ${{ !cancelled() && steps.firmware.outcome == 'success' }}
        run: python3 -B scripts/validate-rc01-public-artifacts.py "$TARGET_DIR" key-build.pub public-key.pem

      - name: Preserve unverified images before acceptance checks
        if: ${{ !cancelled() && steps.firmware.outcome == 'success' && steps.image_privacy.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: rc01-unverified-images
          if-no-files-found: error
          retention-days: 7
          path: ${{ env.TARGET_DIR }}/

      - name: Upload matching package archives
        if: ${{ !cancelled() && steps.firmware.outcome == 'success' && steps.image_privacy.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: rc01-packages-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            bin/packages/**/*.apk
            ${{ env.TARGET_DIR }}/packages/*.apk
            key-build.pub
            key-build.ucert
            public-key.pem

      - name: Verify native driver artifacts and runtime scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/validate-rc01-go-version.py
          for module in ath12k.ko ath12k_wifi7.ko qcom-ppe.ko emc2305.ko; do
            test -n "$(find build_dir -type f -name "$module" -print -quit)"
          done
          ath12k_wifi7="$(find build_dir -type f -name ath12k_wifi7.ko -print -quit)"
          grep -aq 'unsupported-mlo' "$ath12k_wifi7"
          kernel_dir="$(find build_dir -type d -path '*/linux-qualcommbe_ipq95xx/linux-6.18.*' -print -quit)"
          test -n "$kernel_dir"
          sh scripts/validate-rc01-nand.sh "$kernel_dir" "$kernel_dir/vmlinux"
          if [ "$RC01_WITH_DAE" = true ]; then
            sh scripts/validate-rc01-dae-kernel.sh "$kernel_dir/.config" "$kernel_dir/vmlinux"
          fi
          test -x staging_dir/hostpkg/bin/ucode || make -j4 package/utils/ucode/host/compile
          wireless_dir="$(find build_dir -type d -path '*/backports-7.2' -print -quit)"
          test -n "$wireless_dir"
          python3 -B scripts/validate-rc01-platform.py "$kernel_dir" "$wireless_dir" > "$TARGET_DIR/rc01-platform-validation.json"
          UCODE="$PWD/staging_dir/hostpkg/bin/ucode" \
            RC01_KERNEL_SOURCE="$PWD/$kernel_dir" RC01_WIRELESS_SOURCE="$PWD/$wireless_dir" \
            python3 -B - <<'PYTEST'
          import sys
          import unittest
          suite = unittest.defaultTestLoader.discover("tests/rc01")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped:
              print("Post-build regression checks must not be skipped.", file=sys.stderr)
          sys.exit(not result.wasSuccessful() or bool(result.skipped))
          PYTEST

      - name: Verify boot compatibility and image budget
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/verify-rc01-images.py "$TARGET_DIR" | tee "$TARGET_DIR/rc01-image-validation.json"
          python3 -B scripts/verify-rc01-wireless-artifacts.py "$TARGET_DIR" > "$TARGET_DIR/rc01-wireless-artifacts.json"

      - name: Check final validation records before publishing
        id: verified_privacy
        run: python3 -B scripts/validate-rc01-public-artifacts.py "$TARGET_DIR"

      - name: Upload verified images and build metadata
        if: ${{ success() && steps.verified_privacy.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: rc01-duv2-120m-dhcp-complete-${{ inputs.include_dae && 'dae-test' || 'nikki' }}-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ env.TARGET_DIR }}/*xiaomi_be10000-squashfs-*
            ${{ env.TARGET_DIR }}/rc01*
            ${{ env.TARGET_DIR }}/*.manifest
            ${{ env.TARGET_DIR }}/config.buildinfo
            ${{ env.TARGET_DIR }}/feeds.buildinfo
            ${{ env.TARGET_DIR }}/version.buildinfo
            ${{ env.TARGET_DIR }}/profiles.json
            ${{ env.TARGET_DIR }}/sha256sums

      - name: Check failure logs before publishing
        id: logs_privacy
        if: failure()
        run: python3 -B scripts/validate-rc01-public-artifacts.py prepare.log download.log build.log logs

      - name: Upload failure logs
        if: ${{ failure() && steps.logs_privacy.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: rc01-failure-logs-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            prepare.log
            download.log
            build.log
            logs

      - name: Save downloads even after validation failure
        if: ${{ !cancelled() && !inputs.cold_cache && steps.cache_state.outputs.downloads_save == 'true' && steps.downloads.outcome == 'success' && steps.build_metrics.outcome == 'success' && (steps.firmware.outcome == 'success' || steps.firmware.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: dl
          key: ${{ steps.downloads_lookup.outputs.cache-primary-key }}

      - name: Save compiler objects even after validation failure
        if: ${{ !cancelled() && !inputs.cold_cache && steps.cache_state.outputs.compiler_save == 'true' && steps.build_metrics.outcome == 'success' && (steps.firmware.outcome == 'success' || steps.firmware.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ steps.compiler_lookup.outputs.cache-primary-key }}
