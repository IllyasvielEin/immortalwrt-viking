name: Build Xiaomi RC01 DHCP complete firmware

on:
  workflow_dispatch:
    inputs:
      include_dae:
        description: 'Experimental dae 2026.10.30 + daede UI (runtime unverified)'
        type: boolean
        required: true
        default: false
      go_bootstrap:
        description: 'Go bootstrap: verified official binary or full source chain'
        type: choice
        required: true
        default: external
        options:
          - external
          - source
      cold_cache:
        description: 'Skip download/ccache restore and save; use fresh local caches'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: rc01-${{ github.ref }}
  cancel-in-progress: false

env:
  TARGET_DIR: bin/targets/qualcommbe/ipq95xx
  CCACHE_MAXSIZE: 3G
  CCACHE_COMPILERCHECK: content
  RC01_GO_BOOTSTRAP_MODE: ${{ inputs.go_bootstrap }}
  TZ: Asia/Singapore
  RC01_WITH_DAE: ${{ inputs.include_dae }}

jobs:
  build:
    name: RC01 Du v2 / 120 MiB / DHCP complete
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout custom source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record source time
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Reclaim runner space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker system prune --all --force --volumes || true
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang llvm flex bison gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev zlib1g-dev python3-dev python3-setuptools \
            python3-pyelftools python3-cryptography rsync swig unzip file wget \
            pkg-config ca-certificates xz-utils zstd device-tree-compiler mtd-utils shellcheck busybox

      - name: Look up source downloads
        id: downloads_lookup
        if: ${{ !inputs.cold_cache }}
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: dl
          lookup-only: true
          key: rc01-dl-${{ runner.os }}-${{ hashFiles('config/rc01/feeds.conf', 'config/rc01/dae.config', 'defconfig/qualcommbe-rc01.config') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            rc01-dl-${{ runner.os }}-${{ hashFiles('config/rc01/feeds.conf', 'config/rc01/dae.config', 'defconfig/qualcommbe-rc01.config') }}-
            rc01-dl-${{ runner.os }}-


      - name: Restore source downloads
        id: downloads_cache
        if: ${{ !inputs.cold_cache && steps.downloads_lookup.outputs.cache-matched-key != '' }}
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: ${{ steps.downloads_lookup.outputs.cache-matched-key }}

      - name: Look up compiler cache
        id: compiler_lookup
        if: ${{ !inputs.cold_cache }}
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          lookup-only: true
          key: rc01-ccache-v2-content-${{ runner.os }}-${{ runner.arch }}-qualcommbe-ipq95xx-${{ hashFiles('toolchain/**', 'include/toolchain*.mk', 'rules.mk', 'target/linux/generic/kernel-6.18') }}-${{ hashFiles('defconfig/qualcommbe-rc01.config', 'config/rc01/dae.config') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            rc01-ccache-v2-content-${{ runner.os }}-${{ runner.arch }}-qualcommbe-ipq95xx-${{ hashFiles('toolchain/**', 'include/toolchain*.mk', 'rules.mk', 'target/linux/generic/kernel-6.18') }}-${{ hashFiles('defconfig/qualcommbe-rc01.config', 'config/rc01/dae.config') }}-
            rc01-ccache-v2-content-${{ runner.os }}-${{ runner.arch }}-qualcommbe-ipq95xx-${{ hashFiles('toolchain/**', 'include/toolchain*.mk', 'rules.mk', 'target/linux/generic/kernel-6.18') }}-


      - name: Restore compiler cache
        id: compiler_cache
        if: ${{ !inputs.cold_cache && steps.compiler_lookup.outputs.cache-matched-key != '' }}
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ${{ steps.compiler_lookup.outputs.cache-matched-key }}

      - name: Discard incomplete cache restores or select cold mode
        id: cache_state
        shell: bash
        env:
          RC01_COLD_CACHE: ${{ inputs.cold_cache }}
          RC01_DOWNLOADS_LOOKUP_OUTCOME: ${{ steps.downloads_lookup.outcome }}
          RC01_DOWNLOADS_EXPECTED_KEY: ${{ steps.downloads_lookup.outputs.cache-matched-key }}
          RC01_DOWNLOADS_RESTORE_OUTCOME: ${{ steps.downloads_cache.outcome }}
          RC01_DOWNLOADS_RESTORED_KEY: ${{ steps.downloads_cache.outputs.cache-matched-key }}
          RC01_COMPILER_LOOKUP_OUTCOME: ${{ steps.compiler_lookup.outcome }}
          RC01_COMPILER_EXPECTED_KEY: ${{ steps.compiler_lookup.outputs.cache-matched-key }}
          RC01_COMPILER_RESTORE_OUTCOME: ${{ steps.compiler_cache.outcome }}
          RC01_COMPILER_RESTORED_KEY: ${{ steps.compiler_cache.outputs.cache-matched-key }}
        run: python3 -B scripts/rc01-ci-cache.py

      - name: Run offline regression checks
        run: python3 -B -m unittest discover -s tests/rc01 -v

      - name: Select and verify Go bootstrap before configuration
        shell: bash
        run: |
          set -euo pipefail
          case "$RC01_GO_BOOTSTRAP_MODE" in
            external)
              bootstrap_root="$(python3 -B scripts/rc01-go-bootstrap.py install "$RUNNER_TEMP/rc01-go-bootstrap")"
              echo "RC01_GO_BOOTSTRAP_ROOT=$bootstrap_root" >> "$GITHUB_ENV"
              ;;
            source) echo 'RC01_GO_BOOTSTRAP_ROOT=' >> "$GITHUB_ENV" ;;
            *) echo 'Invalid bootstrap mode' >&2; exit 1 ;;
          esac

      - name: Prepare locked feeds and configuration
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/prepare-rc01.sh 2>&1 | tee prepare.log
          ./scripts/diffconfig.sh > rc01.diffconfig

      - name: Download package sources
        id: downloads
        shell: bash
        run: |
          set -o pipefail
          if ! make -j4 download 2>&1 | tee download.log; then
            make -j1 V=s download 2>&1 | tee -a download.log
          fi

      - name: Initialize build observations
        id: build_metrics
        shell: bash
        env:
          RC01_COLD_CACHE: ${{ inputs.cold_cache }}
          RC01_DOWNLOADS_MATCHED_KEY: ${{ steps.downloads_cache.outputs.cache-matched-key }}
          RC01_COMPILER_MATCHED_KEY: ${{ steps.compiler_cache.outputs.cache-matched-key }}
          RC01_DOWNLOADS_CACHE_OUTCOME: ${{ steps.downloads_cache.outcome }}
          RC01_COMPILER_CACHE_OUTCOME: ${{ steps.compiler_cache.outcome }}
        run: python3 -B scripts/rc01-ci-metrics.py prepare "$RUNNER_TEMP/rc01-metrics"

      - name: Build firmware
        id: firmware
        shell: bash
        run: python3 -B scripts/rc01-ci-build.py

      - name: Record compiler/cache statistics before acceptance builds
        if: ${{ !cancelled() && steps.build_metrics.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          RC01_COLD_CACHE: ${{ inputs.cold_cache }}
          RC01_DOWNLOADS_MATCHED_KEY: ${{ steps.downloads_cache.outputs.cache-matched-key }}
          RC01_COMPILER_MATCHED_KEY: ${{ steps.compiler_cache.outputs.cache-matched-key }}
          RC01_DOWNLOADS_CACHE_OUTCOME: ${{ steps.downloads_cache.outcome }}
          RC01_COMPILER_CACHE_OUTCOME: ${{ steps.compiler_cache.outcome }}
        run: python3 -B scripts/rc01-ci-metrics.py report "$RUNNER_TEMP/rc01-metrics"

      - name: Upload build observations
        if: ${{ !cancelled() && steps.build_metrics.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: rc01-build-observations-${{ github.run_number }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/rc01-metrics/
            rc01-build-timings.json

      - name: Record build inputs
        shell: bash
        run: |
          set -euo pipefail
          go_compiler="$(GOTOOLCHAIN=local GOENV=off staging_dir/hostpkg/lib/go-1.27/bin/go version)"
          cp .config "$TARGET_DIR/rc01.config"
          if [ -f rc01-build-timings.json ]; then
            cp rc01-build-timings.json "$TARGET_DIR/rc01-build-timings.json"
          fi
          for phase in prepare report; do
            if [ -f "$RUNNER_TEMP/rc01-metrics/$phase.json" ]; then
              cp "$RUNNER_TEMP/rc01-metrics/$phase.json" "$TARGET_DIR/rc01-ci-$phase.json"
            fi
          done
          cp rc01.diffconfig "$TARGET_DIR/rc01.diffconfig"
          cp config/rc01/feeds.conf "$TARGET_DIR/rc01-feeds.lock"
          cp files/etc/uci-defaults/89-rc01-bypass "$TARGET_DIR/rc01-network-defaults.sh"
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "source_commit=$(git rev-parse HEAD)"
            echo "source_tree=$(git rev-parse 'HEAD^{tree}')"
            echo "viking_baseline=e5b0e82156513e81b6b712e4498ab15fd3a28571"
            echo "viking_reviewed_head=a8d4a44c8ede4c703e8866fbf709b34dd1506294"
            echo "viking_followup_commits=4e7173571c64faced3172e51a83fa314d5d5f600,47ce1cd5dfeffb9c7789c8b637f654098898d6a3,d58d0507801a3cab73802e6434314eea0596ba31,5dbfbfe46225e244fe06c42f11b50bc710f731dd"
            echo "ppe_ds_nodes_ipq9574=3"
            echo "source_date_epoch=$SOURCE_DATE_EPOCH"
            echo "kernel=$(cat target/linux/generic/kernel-6.18)"
            echo "go_bootstrap_mode=$RC01_GO_BOOTSTRAP_MODE"
            echo "go_bootstrap_version=1.24.13"
            if [ "$RC01_GO_BOOTSTRAP_MODE" = external ]; then
              echo "go_bootstrap_archive_sha256=1fc94b57134d51669c72173ad5d49fd62afb0f1db9bf3f798fd98ee423f8d730"
            fi
            echo "go_compiler=$go_compiler"
            echo "ccache_compiler_check=$CCACHE_COMPILERCHECK"
            echo "cold_cache=${{ inputs.cold_cache }}"
            echo "physical_acceptance=not-performed"
            echo "boot_verified_base=43fc40c991523305d8ec5ff1b5714f063dfeb091"
            echo "lan_address_mode=dhcp-client"
            echo "dhcp_client_hostname=RC01"
            echo "fan_pwm_output=push-pull"
            echo "dae_test_build=$RC01_WITH_DAE"
            echo "nand_id_workaround=spi-device-prefix-max-3"
            echo "nand_probe_diagnostics=true"
            for feed in packages luci routing nikki daede; do
              echo "feed_$feed=$(git -C "feeds/$feed" rev-parse HEAD)"
            done
          } > "$TARGET_DIR/rc01-build-metadata.txt"
          cp target/linux/qualcommbe/patches-6.18/0411-mtd-spinand-qpic-four-byte-id.patch "$TARGET_DIR/rc01-nand-id-workaround.patch"
          cp target/linux/qualcommbe/patches-6.18/0412-mtd-spinand-rc01-probe-diagnostics.patch "$TARGET_DIR/rc01-nand-probe-diagnostics.patch"
          git -C feeds/nikki diff -- mihomo-meta/Makefile > "$TARGET_DIR/rc01-nikki-build.patch"
          git -C feeds/packages diff -- lang/golang/golang-compiler.mk lang/golang/golang-host-build.mk > "$TARGET_DIR/rc01-go-build.patch"
          if [ "$RC01_WITH_DAE" = true ]; then
            cp feeds/daede/ci/pins.env "$TARGET_DIR/rc01-daede-upstream.lock"
            cp config/rc01/patches/daede/100-rc01-dae-lifecycle-and-source-policy.patch "$TARGET_DIR/rc01-daede-build.patch"
            cp feeds/daede/dae/Makefile "$TARGET_DIR/rc01-dae.Makefile"
          fi
          (cd "$TARGET_DIR"; sha256sum *xiaomi_be10000-squashfs-* > rc01-images.sha256)

      - name: Preserve unverified images before acceptance checks
        if: ${{ !cancelled() && steps.firmware.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: rc01-unverified-images
          if-no-files-found: error
          retention-days: 7
          path: ${{ env.TARGET_DIR }}/

      - name: Upload matching package archives
        if: ${{ !cancelled() && steps.firmware.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: rc01-packages-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            bin/packages/**/*.apk
            ${{ env.TARGET_DIR }}/packages/*.apk
            key-build.pub
            key-build.ucert
            public-key.pem

      - name: Verify native driver artifacts and runtime scripts
        shell: bash
        run: |
          set -euo pipefail
          test "$(GOTOOLCHAIN=local GOENV=off staging_dir/hostpkg/lib/go-1.27/bin/go version)" = 'go version go1.27.3 linux/amd64'
          for module in ath12k.ko ath12k_wifi7.ko qcom-ppe.ko emc2305.ko; do
            test -n "$(find build_dir -type f -name "$module" -print -quit)"
          done
          ath12k_wifi7="$(find build_dir -type f -name ath12k_wifi7.ko -print -quit)"
          grep -aq 'unsupported-mlo' "$ath12k_wifi7"
          kernel_dir="$(find build_dir -type d -path '*/linux-qualcommbe_ipq95xx/linux-6.18.*' -print -quit)"
          test -n "$kernel_dir"
          sh scripts/validate-rc01-nand.sh "$kernel_dir" "$kernel_dir/vmlinux"
          if [ "$RC01_WITH_DAE" = true ]; then
            sh scripts/validate-rc01-dae-kernel.sh "$kernel_dir/.config" "$kernel_dir/vmlinux"
          fi
          test -x staging_dir/hostpkg/bin/ucode || make -j4 package/utils/ucode/host/compile
          UCODE="$PWD/staging_dir/hostpkg/bin/ucode" python3 -B -m unittest discover -s tests/rc01 -v

      - name: Verify boot compatibility and image budget
        run: python3 -B scripts/verify-rc01-images.py "$TARGET_DIR"

      - name: Upload verified images and build metadata
        uses: actions/upload-artifact@v4
        with:
          name: rc01-duv2-120m-dhcp-complete-${{ inputs.include_dae && 'dae-test' || 'nikki' }}-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ env.TARGET_DIR }}/*xiaomi_be10000-squashfs-*
            ${{ env.TARGET_DIR }}/rc01*
            ${{ env.TARGET_DIR }}/*.manifest
            ${{ env.TARGET_DIR }}/config.buildinfo
            ${{ env.TARGET_DIR }}/feeds.buildinfo
            ${{ env.TARGET_DIR }}/version.buildinfo
            ${{ env.TARGET_DIR }}/profiles.json
            ${{ env.TARGET_DIR }}/sha256sums

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rc01-failure-logs-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            prepare.log
            download.log
            build.log
            logs

      - name: Save downloads even after validation failure
        if: ${{ !cancelled() && !inputs.cold_cache && steps.cache_state.outputs.downloads_save == 'true' && steps.downloads.outcome == 'success' && steps.build_metrics.outcome == 'success' && (steps.firmware.outcome == 'success' || steps.firmware.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: dl
          key: ${{ steps.downloads_lookup.outputs.cache-primary-key }}

      - name: Save compiler objects even after validation failure
        if: ${{ !cancelled() && !inputs.cold_cache && steps.cache_state.outputs.compiler_save == 'true' && steps.build_metrics.outcome == 'success' && (steps.firmware.outcome == 'success' || steps.firmware.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ steps.compiler_lookup.outputs.cache-primary-key }}
